name: Bug report
description: Something isn't reconciling the way it should
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including the affected CRD kind(s).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: CRs applied, commands run, etc. Redact secrets/PII.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Relevant status/logs
      description: |
        Output of `kubectl describe` on the affected CR, and/or manager logs.
      render: shell
  - type: input
    id: version
    attributes:
      label: polaris-k8s version / commit
    validations:
      required: true
  - type: input
    id: k8s-version
    attributes:
      label: Kubernetes version
    validations:
      required: true
