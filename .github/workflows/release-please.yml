# Maintains a standing "Release vX.Y.Z" PR from Conventional Commits on
# main. Merging that PR is what actually creates the tag and the GitHub
# Release (which in turn triggers release.yml). See CONTRIBUTING.md for the
# commit message convention this depends on.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
