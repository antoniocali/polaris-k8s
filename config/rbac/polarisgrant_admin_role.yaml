# This rule is not used by the project polaris-k8s itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over polaris.k8s.calific.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: polaris-k8s
    app.kubernetes.io/managed-by: kustomize
  name: polarisgrant-admin-role
rules:
- apiGroups:
  - polaris.k8s.calific.io
  resources:
  - polarisgrants
  verbs:
  - '*'
- apiGroups:
  - polaris.k8s.calific.io
  resources:
  - polarisgrants/status
  verbs:
  - get
