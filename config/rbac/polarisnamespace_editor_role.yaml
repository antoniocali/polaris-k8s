# This rule is not used by the project polaris-k8s itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the polaris.k8s.calific.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: polaris-k8s
    app.kubernetes.io/managed-by: kustomize
  name: polarisnamespace-editor-role
rules:
- apiGroups:
  - polaris.k8s.calific.io
  resources:
  - polarisnamespaces
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - polaris.k8s.calific.io
  resources:
  - polarisnamespaces/status
  verbs:
  - get
