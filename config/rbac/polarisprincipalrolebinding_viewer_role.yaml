# This rule is not used by the project polaris-k8s itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to polaris.k8s.calific.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: polaris-k8s
    app.kubernetes.io/managed-by: kustomize
  name: polarisprincipalrolebinding-viewer-role
rules:
- apiGroups:
  - polaris.k8s.calific.io
  resources:
  - polarisprincipalrolebindings
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - polaris.k8s.calific.io
  resources:
  - polarisprincipalrolebindings/status
  verbs:
  - get
