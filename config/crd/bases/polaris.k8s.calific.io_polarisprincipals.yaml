---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: polarisprincipals.polaris.k8s.calific.io
spec:
  group: polaris.k8s.calific.io
  names:
    categories:
    - polaris
    kind: PolarisPrincipal
    listKind: PolarisPrincipalList
    plural: polarisprincipals
    shortNames:
    - pprin
    singular: polarisprincipal
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.principalId
      name: PrincipalID
      type: string
    - jsonPath: .spec.credentialsSecretRef.name
      name: Secret
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PolarisPrincipal is an identity (user or service) registered in Polaris.
          The operator manages the lifecycle of the principal and surfaces the
          generated clientId/clientSecret to a user-named Secret.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PolarisPrincipalSpec defines an identity (user or service)
              in Polaris.
            properties:
              connectionRef:
                description: connectionRef points at the PolarisConnection the principal
                  lives on.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    maxLength: 253
                    type: string
                required:
                - name
                type: object
              credentialRotationRequired:
                default: false
                description: |-
                  credentialRotationRequired marks the principal as needing its
                  clientSecret rotated on next reconcile.
                type: boolean
              credentialsSecretRef:
                description: |-
                  credentialsSecretRef names the same-namespace Secret into which the
                  operator writes the clientId and clientSecret returned by Polaris when
                  the principal is created or rotated. The operator owns this Secret.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              name:
                description: name is the principal name in Polaris. Defaults to .metadata.name
                  when unset.
                maxLength: 255
                pattern: ^[a-zA-Z0-9_-]+$
                type: string
              properties:
                additionalProperties:
                  type: string
                description: |-
                  properties is the open-ended property bag Polaris stores alongside
                  the principal (e.g. department, owner-team).
                type: object
            required:
            - connectionRef
            - credentialsSecretRef
            type: object
          status:
            description: PolarisPrincipalStatus reports the observed state of a principal.
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the principal.
                  Standard types: Ready, CredentialsWritten.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              credentialsLastRotated:
                description: |-
                  credentialsLastRotated records when the operator last wrote a new
                  clientSecret into credentialsSecretRef.
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              principalId:
                description: principalId is the server-side identifier for the principal.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
