              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PolarisTableSpec defines an Iceberg table managed in a Polaris
              namespace.
            properties:
              name:
                description: name is the table name in Polaris. Defaults to .metadata.name
                  when unset.
                maxLength: 255
                pattern: ^[a-zA-Z0-9_-]+$
