{{- if .Values.crd.enable }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.20.1
  name: polarisgrants.polaris.k8s.calific.io
spec:
  group: polaris.k8s.calific.io
  names:
    categories:
    - polaris
    kind: PolarisGrant
    listKind: PolarisGrantList
    plural: polarisgrants
    shortNames:
    - pgrant
    singular: polarisgrant
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.catalogRoleRef.name
      name: Role
      type: string
    - jsonPath: .spec.privilege
      name: Privilege
      type: string
    - jsonPath: .spec.target.type
      name: Target
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PolarisGrant attaches a Polaris privilege on a target (catalog, namespace,
          table, or view) to a PolarisCatalogRole. One privilege per CR — this keeps
          grants individually addressable for revocation and auditing.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PolarisGrantSpec attaches a single privilege on a single target to a
              PolarisCatalogRole.
            properties:
              catalogRoleRef:
                description: catalogRoleRef points at the PolarisCatalogRole receiving
                  the grant.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    maxLength: 253
                    type: string
                required:
                - name
                type: object
              privilege:
                description: privilege is the access right being granted.
                enum:
                - CATALOG_MANAGE_CONTENT
                - CATALOG_MANAGE_ACCESS
                - CATALOG_MANAGE_METADATA
                - CATALOG_READ_PROPERTIES
                - CATALOG_WRITE_PROPERTIES
                - NAMESPACE_CREATE
                - NAMESPACE_DROP
                - NAMESPACE_LIST
                - NAMESPACE_READ_PROPERTIES
                - NAMESPACE_WRITE_PROPERTIES
                - NAMESPACE_FULL_METADATA
                - TABLE_CREATE
                - TABLE_DROP
                - TABLE_LIST
                - TABLE_READ_PROPERTIES
                - TABLE_WRITE_PROPERTIES
                - TABLE_READ_DATA
                - TABLE_WRITE_DATA
                - TABLE_FULL_METADATA
                - VIEW_CREATE
                - VIEW_DROP
                - VIEW_LIST
                - VIEW_READ_PROPERTIES
                - VIEW_WRITE_PROPERTIES
                - VIEW_FULL_METADATA
                type: string
              target:
                description: target identifies the Polaris resource the privilege
                  applies to.
                properties:
                  namespaceRef:
                    description: namespaceRef is required when type is namespace,
                      table, or view.
                    properties:
                      name:
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        maxLength: 253
                        type: string
                    required:
                    - name
                    type: object
                  tableRef:
                    description: tableRef is required when type is table.
                    properties:
                      name:
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        maxLength: 253
                        type: string
                    required:
                    - name
                    type: object
                  type:
                    description: type selects the resource kind the privilege applies
                      to.
                    enum:
                    - catalog
                    - namespace
                    - table
                    - view
                    type: string
                  viewRef:
                    description: viewRef is required when type is view.
                    properties:
                      name:
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        maxLength: 253
                        type: string
                    required:
                    - name
                    type: object
                required:
                - type
                type: object
            required:
            - catalogRoleRef
            - privilege
            - target
            type: object
            x-kubernetes-validations:
            - message: target.namespaceRef is required when target.type is namespace
              rule: self.target.type != 'namespace' || has(self.target.namespaceRef)
            - message: target.namespaceRef and target.tableRef are required when target.type
                is table
              rule: self.target.type != 'table' || (has(self.target.namespaceRef)
                && has(self.target.tableRef))
            - message: target.namespaceRef and target.viewRef are required when target.type
                is view
              rule: self.target.type != 'view' || (has(self.target.namespaceRef) &&
                has(self.target.viewRef))
            - message: when target.type is catalog, no sub-refs may be set
              rule: self.target.type != 'catalog' || (!has(self.target.namespaceRef)
                && !has(self.target.tableRef) && !has(self.target.viewRef))
          status:
            description: PolarisGrantStatus reports the observed state of a grant.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
