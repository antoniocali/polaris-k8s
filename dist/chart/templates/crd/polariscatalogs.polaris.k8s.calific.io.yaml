{{- if .Values.crd.enable }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.20.1
  name: polariscatalogs.polaris.k8s.calific.io
spec:
  group: polaris.k8s.calific.io
  names:
    categories:
    - polaris
    kind: PolarisCatalog
    listKind: PolarisCatalogList
    plural: polariscatalogs
    shortNames:
    - pcat
    singular: polariscatalog
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.storageConfig.storageType
      name: Storage
      type: string
    - jsonPath: .spec.defaultBaseLocation
      name: Location
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PolarisCatalog is a top-level Polaris catalog (the parent of every Polaris
          namespace, table, view, and catalog-scoped role).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PolarisCatalogSpec defines a top-level catalog within a Polaris
              server.
            properties:
              connectionRef:
                description: connectionRef points at the PolarisConnection this catalog
                  lives on.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    maxLength: 253
                    type: string
                required:
                - name
                type: object
              defaultBaseLocation:
                description: |-
                  defaultBaseLocation is the storage URI under which new tables are
                  placed unless overridden.
                maxLength: 2048
                minLength: 1
                type: string
              name:
                description: name is the catalog name in Polaris. Defaults to .metadata.name
                  when unset.
                maxLength: 255
                pattern: ^[a-zA-Z0-9_-]+$
                type: string
              properties:
                additionalProperties:
                  type: string
                description: |-
                  properties is the open-ended property bag Polaris associates with the
                  catalog. Keys/values are user-defined.
                type: object
              storageConfig:
                description: storageConfig is the cloud-storage configuration backing
                  the catalog.
                properties:
                  allowedLocations:
                    description: |-
                      allowedLocations enumerates the URI prefixes Polaris is permitted to
                      read from / write to. At least one is required.
                    items:
                      type: string
                    maxItems: 50
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  azure:
                    description: AzureStorageConfig holds Azure-specific storage configuration.
                    properties:
                      consentUrl:
                        description: |-
                          consentUrl is the Azure consent URL surfaced to the operator for
                          admin consent flows.
                        maxLength: 2048
                        type: string
                      multiTenantAppName:
                        description: multiTenantAppName is the Azure AD multi-tenant
                          application name, if used.
                        maxLength: 128
                        type: string
                      tenantId:
                        description: tenantId is the Azure AD tenant id Polaris federates
                          with.
                        pattern: ^[0-9a-fA-F-]{36}$
                        type: string
                    required:
                    - tenantId
                    type: object
                  gcs:
                    description: GCSStorageConfig holds GCP-specific storage configuration.
                    properties:
                      gcsServiceAccount:
                        description: gcsServiceAccount is the GCP service account
                          email Polaris impersonates.
                        pattern: ^[^@]+@[^@]+\.iam\.gserviceaccount\.com$
                        type: string
                    required:
                    - gcsServiceAccount
                    type: object
                  s3:
                    description: S3StorageConfig holds AWS-specific storage configuration.
                    properties:
                      externalId:
                        description: externalId, when set, is required on the role's
                          trust policy.
                        maxLength: 1224
                        type: string
                      region:
                        description: region is the AWS region of the bucket (e.g.
                          eu-west-1).
                        maxLength: 64
                        minLength: 1
                        type: string
                      roleArn:
                        description: roleArn is the IAM role Polaris will assume to
                          access S3.
                        pattern: ^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/.+$
                        type: string
                      userArn:
                        description: |-
                          userArn is an optional ARN of the user/role Polaris itself runs as,
                          surfaced for principals that need to add it to a trust policy.
                        maxLength: 2048
                        type: string
                    required:
                    - region
                    - roleArn
                    type: object
                  storageType:
                    description: storageType selects which cloud backend the catalog
                      data lives in.
                    enum:
                    - S3
                    - AZURE
                    - GCS
                    - FILE
                    type: string
                required:
                - allowedLocations
                - storageType
                type: object
                x-kubernetes-validations:
                - message: s3 must be set when storageType is S3
                  rule: self.storageType != 'S3' || has(self.s3)
                - message: azure must be set when storageType is AZURE
                  rule: self.storageType != 'AZURE' || has(self.azure)
                - message: gcs must be set when storageType is GCS
                  rule: self.storageType != 'GCS' || has(self.gcs)
              type:
                default: INTERNAL
                description: |-
                  type selects whether Polaris owns the catalog state (INTERNAL) or
                  federates from an external catalog (EXTERNAL).
                enum:
                - INTERNAL
                - EXTERNAL
                type: string
            required:
            - connectionRef
            - defaultBaseLocation
            - storageConfig
            type: object
          status:
            description: PolarisCatalogStatus reports the observed state of a catalog.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              polarisCatalogId:
                description: polarisCatalogId is the server-side identifier for the
                  catalog.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
