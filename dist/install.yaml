    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: polaris-k8s
  name: polaris-k8s-polarisview-viewer-role
rules:
- apiGroups:
  - polaris.k8s.calific.io
  resources:
  - polarisviews
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - polaris.k8s.calific.io
  resources:
  - polarisviews/status
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: polaris-k8s
  name: polaris-k8s-leader-election-rolebinding
  namespace: polaris-k8s-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: polaris-k8s-leader-election-role
subjects:
- kind: ServiceAccount
  name: polaris-k8s-controller-manager
  namespace: polaris-k8s-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: polaris-k8s
  name: polaris-k8s-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: polaris-k8s-manager-role
subjects:
- kind: ServiceAccount
  name: polaris-k8s-controller-manager
  namespace: polaris-k8s-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: polaris-k8s-metrics-auth-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: polaris-k8s-metrics-auth-role
subjects:
- kind: ServiceAccount
  name: polaris-k8s-controller-manager
  namespace: polaris-k8s-system
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: polaris-k8s
    control-plane: controller-manager
  name: polaris-k8s-controller-manager-metrics-service
  namespace: polaris-k8s-system
spec:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  selector:
    app.kubernetes.io/name: polaris-k8s
    control-plane: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: polaris-k8s
    control-plane: controller-manager
  name: polaris-k8s-controller-manager
  namespace: polaris-k8s-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: polaris-k8s
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: polaris-k8s
        control-plane: controller-manager
    spec:
      containers:
      - args:
        - --metrics-bind-address=:8443
        - --leader-elect
        - --health-probe-bind-address=:8081
        command:
        - /manager
        image: controller:latest
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts: []
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: polaris-k8s-controller-manager
      terminationGracePeriodSeconds: 10
      volumes: []
